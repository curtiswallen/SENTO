<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SENTO</title>
  </head>
  <body>
    <div id="wrapper">
        <div id="title">SENTO</div>
        <div id="main">
            <h2>EVERYDAY EXTRAORDINARY</h2>
            <p>The first Portland-based high-end communal wellness brand offering elevated design, effective programming, and meaningful transformation.</p>
        </div>
        <div id="contact-form">
            <p class="newsletter-block">NEWSLETTER: <span class="newsletter-input"><input type="text" placeholder="your@email.com"><button>JOIN</button></span></p>
            <p><a href="mailto:contact@sentospace.com">CONTACT</a></p>
        </div>
    </div>

    <style>
        @font-face {
            font-family: "Director Regular";
            src: url("fonts/Director-Regular.woff2") format("woff2"),
                 url("fonts/Director-Regular.woff") format("woff"),
                 url("fonts/Director-Regular.otf") format("opentype"),
                 url("fonts/Director-Regular.ttf") format("truetype");
        }

        body { 
            font-family: "Director Regular"; 
            background-color: #adb6aa;
            color: #111;
            padding: 10vh 5vw; 
            letter-spacing: .1cm;
            margin: 0;
        }

        a {
            color: #fff;
            text-decoration: none;
            opacity: .5;
            border-bottom: 1px solid;
        }

        a:hover {
            opacity: .7;
            transition: 200ms;
        }

        input[type="text"] {
            background: none;
            border: none;
            border-bottom: 1px solid rgba(0,0,0,.25);
            color: #111;
            font-family: "Director Regular"; 
            font-size: 1rem;
            padding: 0;
            margin: 0;
        }

        input[type="text"]::placeholder {
            color: rgba(0,0,0,.25);
        }

        input[type="text"]:focus-visible {
            background: none;
            outline: none;
            border-bottom: 1px solid #111;
        }

        button {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,.5);;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 4px;
            color: #111;
            font-family: "Director Regular";
            font-size: 1.25rem;
            cursor: pointer;
        }

        button:hover {
            border: 1px solid rgba(255,255,255,.5);
            transition: 400ms;
        }

        #wrapper { 
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            gap: 50px;
        }

        #title { 
            font-size: 4rem; 
        }

        #main { 
            align-self: flex-end;
            width: 60%; 
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 400;
            color: #fff;
            opacity: .5;
            margin: 0;
        }

        #main p {
            margin-left: 100px;
            word-spacing: .15cm;
            font-size: 1.25rem;
            letter-spacing: .025cm;
        }

        #contact-form {
            display: flex;
            flex-direction: column;
            gap: 5px;
            letter-spacing: .025cm;
            font-size: 1rem;
        }

        #contact-form p {
            margin: 0;
        }

        .newsletter-block {
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .newsletter-input {
            display: inline-flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10vh 10vw;
            }
            #main {
                width: 80%;
            }
        }
    </style>
  </body>
</html>
